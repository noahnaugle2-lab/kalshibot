# Install as /etc/ssh/sshd_config.d/60-kalshibot-hardening.conf.
PasswordAuthentication no
KbdInteractiveAuthentication no
# Root is the separate administrative identity and remains key-only. The
# unprivileged kalshi runtime account has neither sudo nor Docker access.
PermitRootLogin prohibit-password
PubkeyAuthentication yes
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding local
PermitTunnel no
MaxAuthTries 3
LoginGraceTime 30
AllowUsers root kalshi
